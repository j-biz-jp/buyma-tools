<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パスワード変更ツール</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;color:#2e2b28;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:32px 20px}
h1{font-size:22px;margin:0 0 8px}
input{width:100%;font-size:16px;padding:10px;border:1px solid #cfc8bd;border-radius:6px;box-sizing:border-box}
button{margin-top:10px;font-size:15px;font-weight:700;padding:10px 16px;border:none;border-radius:6px;background:#6b1e2a;color:#fff;cursor:pointer}
pre{background:#f4f1ec;padding:12px;border-radius:6px;white-space:pre-wrap;word-break:break-all;font-size:13px}
ol li{margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>パスワード変更ツール</h1>
  <p>新しいパスワードを入れて「変換する」を押すと、ページに貼り付ける文字列が出ます。</p>
  <input id="pw" placeholder="新しいパスワード">
  <button id="go" type="button">変換する</button>
  <div id="out"></div>
</div>
<script>
document.getElementById("go").addEventListener("click", function(){
  var v = document.getElementById("pw").value.trim();
  if (!v) return;
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(v)).then(function(b){
    var h = Array.prototype.map.call(new Uint8Array(b), function(x){ return ("0" + x.toString(16)).slice(-2); }).join("");
    document.getElementById("out").innerHTML =
      '<p>この文字列をコピーしてください:</p><pre>' + h + '</pre>' +
      '<ol><li>GitHubで <b>trend/index.html</b> を開き、右上の鉛筆マーク(編集)を押す</li>' +
      '<li>キーボードの検索(Ctrl+F / ⌘+F)で <b>var H = "</b> を探す</li>' +
      '<li>その後ろの "" の中身を、上の文字列に置き換える</li>' +
      '<li>右上の「Commit changes」を押して保存する</li>' +
      '<li><b>steps/index.html</b> も同じように変更する</li></ol>' +
      '<p>数分後に新しいパスワードで開けるようになります。前のパスワードで一度開いたスマホでも、新しいパスワードを聞かれます。</p>';
  });
});
</script>
</body>
</html>
