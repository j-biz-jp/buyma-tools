name: BUYMAトレンド 毎朝更新

on:
  schedule:
    # 毎朝 6:42(日本時間)。GitHubの都合で数十分遅れることがあります。
    - cron: "42 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 必要な部品を入れる
        run: pip install requests beautifulsoup4
      - name: BUYMAのランキングを取り込む
        run: python scripts/update_trend.py
      - name: 変更を保存する
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add trend/data.json
          if git diff --cached --quiet; then
            echo "変更はありませんでした"
          else
            git commit -m "トレンドデータを更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
