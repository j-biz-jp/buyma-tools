name: BUYMAトレンド 自動更新

on:
  schedule:
    # 1時間ごとに、BUYMAのランキングが新しくなったかを確認します(毎時17分ごろ)。
    # 新しいランキングが出ていたときだけ全部を取り込み、出ていなければすぐに終わります。
    # GitHubの都合で数十分遅れることがあります。
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trend-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 必要な部品を入れる
        run: pip install requests beautifulsoup4
      - name: BUYMAのランキングを確認して取り込む
        env:
          # 手動で実行したときは、ランキングが同じ日付でも取り込み直す
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/update_trend.py
      - name: 変更を保存する
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add trend/data.json
          if git diff --cached --quiet; then
            echo "変更はありませんでした"
          else
            git commit -m "トレンドデータを更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
